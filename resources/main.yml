resources:
  jobs:
    main:
      name: main
      tags:
        project_name: "llmops-databricks-course-sly20"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: main
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/main.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
              run_id: "{{job.run_id}}"
